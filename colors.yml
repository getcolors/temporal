profile: temporal-example
workdir: .colors
provider-compute: digitalocean
provider-dns: cloudflare
provider-backend: r2
compute-prevent-destroy: true
temporal-version: 1.31.2
temporal-services: [frontend, history, matching, worker]
temporal-namespace: benchmark
temporal-retention-days: 7
temporal-typescript-sdk-version: 1.22.0
node-version: 22
postgres-version: 17
postgres-data-dir: /data/postgresql
temporal-data-dir: /data/temporal
reference-application-host: temporal.example.com
reference-application-port: 3000
reference-workflow-delay-seconds: 120
reference-activity-failures: 2
reference-activity-maximum-attempts: 5
reference-duplicate-policy: reject
# The Droplet is named after the profile; set `digitalocean-name` only for an
# account whose naming policy the profile cannot satisfy.
# ams3 is the region this package was verified in; any region that holds an
# account default VPC works, and the registry requires only that one is set.
digitalocean-region: ams3
digitalocean-size: c-8
digitalocean-image: ubuntu-24-04-x64
digitalocean-backups: true
# No `digitalocean-ssh-keys`: the package generates and owns the machine
# keypair at ~/.ssh/<profile> and registers it as an account key named after
# the profile (keygen mode). Set it to an existing account key id to opt out.
# The provider firewall admits TCP 22 from ssh-sources and TCP 80 and 443
# from http-sources, and nothing else; there is no separate https list.
digitalocean-ssh-sources: [127.0.0.1/32]
digitalocean-http-sources: [0.0.0.0/0, "::/0"]
cloudflare-zone: temporal.example.com
cloudflare-proxied: false
tls-provider: letsencrypt

# Remote compute state; replace with the deployment bucket and endpoint.
r2-bucket: tofu-state-example
r2-endpoint: https://example.eu.r2.cloudflarestorage.com
